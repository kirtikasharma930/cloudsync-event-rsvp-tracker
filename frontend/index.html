
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSync | Event Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>☁️ CloudSync</h1>
        <p>Plan Smarter. Connect Faster.</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to CloudSync</h2>
            <p>Manage events and track RSVPs in one place.</p>
            <button id="exploreBtn">Explore Events</button>
        </section>

        <section id="events">
            <h2>Upcoming Events</h2>
           <div id="eventMessage" class="event-list">Your events will appear here.</div> 
        
        <section id="rsvp">
            <h2>Event RSVP</h2>
            <p>Let us know if you will attend the event.</p>

            <form id="rsvpForm">
                <label for="attendeeName">Your Name:</label>
                <input type="text" id="attendeeName" required>

                <label for="rsvpStatus">Your Response:</label>
                <select id="rsvpStatus" required>
                    <option value="Going">Going</option>
                    <option value="Maybe">Maybe</option>
                    <option value="Not Going">Not Going</option>
                </select>

                <button type="submit">Submit RSVP</button>
            </form>

            <p id="rsvpMessage"></p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
