
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSync | Event Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>☁️ CloudSync</h1>
        <p>Plan Smarter. Connect Faster.</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to CloudSync</h2>
            <p>Manage events and track RSVPs in one place.</p>
            <button id="exploreBtn">Explore Events</button>
        </section>

        <section id="events">
            <h2>Upcoming Events</h2>
            <p id="eventMessage">Your events will appear here.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
